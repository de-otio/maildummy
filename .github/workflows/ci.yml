name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # CDK construct (cdk/).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cdk
        timeout-minutes: 5
        run: npm ci

      - name: Build
        working-directory: cdk
        run: npm run build

      - name: Test
        working-directory: cdk
        run: npx jest --coverage

  # Node.js helper (repo root): lib/, bin/, test/.
  js:
    name: JS helper (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json engines is ">=20"; cover the floor and the current LTS.
        node: [20, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Test
        run: npm test

  # Python helper (python/).
  python:
    name: Python helper (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pyproject requires-python is ">=3.11"; cover the floor and the latest.
        python: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package with dev extras
        timeout-minutes: 5
        run: pip install -e "python[dev]"

      - name: Type-check (mypy --strict)
        working-directory: python
        run: mypy --strict src tests

      - name: Test
        working-directory: python
        run: pytest

  # OpenTofu modules and fixtures (terraform/).
  terraform:
    name: OpenTofu (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Fixture roots pinning hashicorp/aws ~> 5.0 and ~> 6.0.
        fixture: [aws5, aws6]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive terraform

      - name: Init fixture
        timeout-minutes: 5
        run: tofu -chdir=terraform/test/fixtures/${{ matrix.fixture }} init -backend=false -input=false

      - name: Validate fixture
        run: tofu -chdir=terraform/test/fixtures/${{ matrix.fixture }} validate

      - name: Test fixture (offline plan)
        timeout-minutes: 5
        run: tofu -chdir=terraform/test/fixtures/${{ matrix.fixture }} test

      - name: Test ses_maildummy module (offline plan)
        timeout-minutes: 5
        run: |
          tofu -chdir=terraform/modules/ses_maildummy init -backend=false -input=false
          tofu -chdir=terraform/modules/ses_maildummy test

  # The single required status check for main. Branch protection names this
  # job instead of each matrix leg, so renaming or extending a matrix cannot
  # leave a PR waiting for a check that never reports.
  ci-required:
    name: ci-required
    if: always()
    needs: [test, js, python, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every CI job succeeded or was skipped
        env:
          RESULTS: >-
            test=${{ needs.test.result }}
            js=${{ needs.js.result }}
            python=${{ needs.python.result }}
            terraform=${{ needs.terraform.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in $RESULTS; do
            job="${pair%%=*}"
            result="${pair#*=}"
            case "$result" in
              success|skipped) echo "ok       $job: $result" ;;
              *) echo "FAILED   $job: ${result:-<no result>}"; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "ci-required: at least one CI job did not succeed."
            exit 1
          fi
