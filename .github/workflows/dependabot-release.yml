# After a Dependabot PR auto-merges, bump the prerelease suffix
# (or patch if stable), tag, and create a GitHub Release. The release
# event then fires publish.yml, which publishes to the registry.

name: Auto-release on Dependabot merge

on:
  push:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      (github.event.head_commit.author.username == 'dependabot[bot]' ||
       contains(github.event.head_commit.message, 'dependabot[bot]'))
    # Pinned to a commit SHA; refresh with:
    #   gh api repos/de-otio/.github/commits/main --jq .sha
    # No `secrets: inherit`: the called workflow only uses the automatic
    # GITHUB_TOKEN, which is passed to reusable workflows implicitly.
    uses: de-otio/.github/.github/workflows/dependabot-release-on-bump.yml@78d17f9083c183ecd05379e1e65744c9228f454a # main
